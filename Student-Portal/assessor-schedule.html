<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillsTrack — Schedule</title>
  <link rel="stylesheet" href="side-bar.css">
  <style>
    .btn-confirm-booking {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--teal);
      background: rgba(45,212,160,.1);
      color: var(--teal);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: .15s;
    }
    .btn-confirm-booking:hover { background: rgba(45,212,160,.22); }

    .btn-cancel-booking {
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: .15s;
    }
    .btn-cancel-booking:hover { border-color: var(--red); color: var(--red); }

    .btn-add-slot {
      padding: 8px 20px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
    }
    .btn-add-slot:hover { opacity: .88; transform: translateY(-1px); }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 30px;
      width: 380px;
      max-width: 95vw;
    }
    .modal h3 { font-size: 16px; margin-bottom: 20px; }
    .modal-close {
      float: right;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
    }
    .modal-field { margin-bottom: 14px; }
    .modal-field label { display: block; font-size: 11px; color: var(--text-muted); letter-spacing: .5px; text-transform: uppercase; margin-bottom: 6px; }
    .modal-field input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .modal-field input:focus { border-color: var(--accent); }
    .btn-modal-submit {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    .btn-modal-submit:disabled { opacity: .6; cursor: not-allowed; }

    body.light .modal { background: #fff; border-color: #e2e6f0; color: #1a1f36; }
    body.light .modal-field input { background: #f4f6fb; border-color: #e2e6f0; color: #1a1f36; }
  </style>
</head>
<body style="visibility:hidden">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div><span class="name">SkillsTrack</span><span class="role">ASSESSOR</span></div>
    </div>
    <nav class="nav">
      <a href="assessor-overview.html">Overview</a>
      <a href="assessor-learners.html">Learners</a>
      <a href="assessor-reviews.html">Reviews</a>
      <a href="assessor-schedule.html" class="active">Schedule</a>
    </nav>
    <div class="footer">
      <strong id="footerName">Loading…</strong>
      <a href="change-password.html">Change Password</a>
      <a href="#" class="signout">⏻ Sign Out</a>
    </div>
  </aside>

  <main class="content">
    <div class="topbar">
      <h1>Schedule</h1>
      <div class="topbar-actions">
        <span class="pill" id="confirmedCount">0 Confirmed</span>
        <button class="btn-add-slot" id="addSlotBtn">+ Add Slot</button>
        <button class="theme-btn" id="themeBtn">☾ Light</button>
      </div>
    </div>

    <div class="page">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Learner</th>
              <th>Date &amp; Time</th>
              <th>Session Type</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="scheduleBody">
            <tr><td class="empty-row" colspan="4">Loading schedule…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add slot modal -->
  <div class="modal-overlay" id="slotModal">
    <div class="modal">
      <button class="modal-close" id="slotModalClose">✕</button>
      <h3>Add Available Slot</h3>
      <form id="slotForm">
        <div class="modal-field">
          <label>Date</label>
          <input id="slotDate" type="date" required>
        </div>
        <div class="modal-field">
          <label>Time</label>
          <input id="slotTime" type="time" required>
        </div>
        <div id="slotFormErr" class="error" style="display:none"></div>
        <button class="btn-modal-submit" type="submit">Add Slot</button>
      </form>
    </div>
  </div>

  <script type="module" src="./assessor-schedule.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillsTrack — Reset Password</title>
  <link rel="stylesheet" href="./forgot-password.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="glow-card">
      <div class="glow-inner">
        <a href="../landing-page/landing-page.html" style="display:inline-block;margin-bottom:14px;font-size:12px;color:var(--text-muted);text-decoration:none">← Back to home</a>
        <div class="form-title">Reset Password</div>
        <p class="form-sub">Enter your email and we'll send a reset link</p>

        <form id="forgotForm">
          <div class="input-group">
            <i class="fa-regular fa-envelope"></i>
            <input id="fp_email" type="email" placeholder="Your account email" autocomplete="email" required>
          </div>

          <div id="fp_err" class="error"></div>
          <div id="fp_ok"  class="success"></div>

          <button class="btn-glow" type="submit">Send Reset Link</button>

          <div class="form-links" style="justify-content:center; margin-top:14px;">
            <a id="backLink" href="../login/learner-login.html">← Back to login</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="./forgot-password.js"></script>
</body>
</html>

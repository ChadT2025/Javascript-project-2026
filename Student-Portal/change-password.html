<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillsTrack — Change Password</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="glow-card">
      <div class="glow-inner">
        <div class="form-title">Change Password</div>
        <p class="form-sub">Confirm your current password first</p>

        <form id="changeForm">
          <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input id="cp_old" type="password" placeholder="Current password" autocomplete="current-password" required>
          </div>

          <div class="input-group">
            <i class="fa-solid fa-key"></i>
            <input id="cp_new" type="password" placeholder="New password (min 6 characters)" autocomplete="new-password" required>
          </div>

          <div id="cp_err" class="error"></div>
          <div id="cp_ok"  class="success"></div>

          <button class="btn-glow" type="submit">Update Password</button>

          <div class="form-links" style="justify-content:center; margin-top:14px;">
            <a id="backLink" href="#">← Back to dashboard</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { initChangePasswordForm } from "./auth.js";
    initChangePasswordForm();
  </script>
</body>
</html>

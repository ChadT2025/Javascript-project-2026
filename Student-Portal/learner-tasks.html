<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillsTrack — Tasks</title>
  <link rel="stylesheet" href="side-bar.css">
  <style>
    .task-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 14px 20px;
      border-radius: 8px;
      border-left: 3px solid var(--accent);
      background: rgba(124,92,255,.04);
      margin-bottom: 10px;
    }
    .task-row.in-progress { border-left-color: var(--amber); }
    .task-row.pending     { border-left-color: #5b8def;      }
    .task-row.submitted   { border-left-color: var(--teal);  }
    .task-row.approved    { border-left-color: var(--green);  }
    .task-row.rejected    { border-left-color: var(--red);   }

    .task-left { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
    .task-title { font-size: 14px; font-weight: 500; }
    .task-meta  { font-size: 11px; color: var(--text-muted); }

    .task-right   { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .task-actions { display: flex; gap: 6px; }

    .btn-task-action {
      padding: 5px 12px;
      border: 1px solid var(--accent);
      border-radius: 20px;
      background: rgba(124,92,255,.12);
      color: var(--accent-light);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: .15s;
    }
    .btn-task-action:hover { background: rgba(124,92,255,.25); }

    .btn-task-delete {
      width: 28px; height: 28px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      transition: .15s;
    }
    .btn-task-delete:hover { border-color: var(--red); color: var(--red); }

    .btn-add {
      padding: 8px 20px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: .2s;
    }
    .btn-add:hover { opacity: .88; transform: translateY(-1px); }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 30px;
      width: 400px;
      max-width: 95vw;
    }
    .modal h3 { font-size: 16px; margin-bottom: 20px; }
    .modal-close {
      float: right;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }
    .modal-field { margin-bottom: 14px; }
    .modal-field label { display: block; font-size: 11px; color: var(--text-muted); letter-spacing: .5px; text-transform: uppercase; margin-bottom: 6px; }
    .modal-field input,
    .modal-field select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: .2s;
    }
    .modal-field input:focus,
    .modal-field select:focus { border-color: var(--accent); }
    .modal-field select option { background: #141a33; }
    .btn-modal-submit {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: .2s;
    }
    .btn-modal-submit:hover { background: var(--accent-dark); }
    .btn-modal-submit:disabled { opacity: .6; cursor: not-allowed; }

    body.light .modal { background: #fff; border-color: #e2e6f0; color: #1a1f36; }
    body.light .modal-field input,
    body.light .modal-field select { background: #f4f6fb; border-color: #e2e6f0; color: #1a1f36; }
    body.light .task-row { background: rgba(124,92,255,.03); }
  </style>
</head>
<body style="visibility:hidden">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div><span class="name">SkillsTrack</span><span class="role">LEARNER</span></div>
    </div>
    <nav class="nav">
      <a href="learner-dashboard.html">Dashboard</a>
      <a href="learner-progress.html">Progress</a>
      <a href="learner-tasks.html" class="active">Tasks</a>
      <a href="booking.html">Booking</a>
    </nav>
    <div class="footer">
      <strong id="footerName">Loading…</strong>
      <a href="change-password.html">Change Password</a>
      <a href="#" class="signout">⏻ Sign Out</a>
    </div>
  </aside>

  <main class="content">
    <div class="topbar">
      <h1>Task Manager</h1>
      <div class="topbar-actions">
        <button class="btn-add" id="addTaskBtn">+ New Task</button>
        <button class="theme-btn" id="themeBtn">☾ Light</button>
      </div>
    </div>

    <div class="page">
      <input class="search" id="filterInput" type="search" placeholder="Filter tasks…">
      <div id="taskList"><p class="empty">Loading…</p></div>
    </div>
  </main>

  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <h3>New Task</h3>
      <form id="taskForm">
        <div class="modal-field">
          <label>Task title</label>
          <input id="taskTitle" placeholder="e.g. Develop login form validation" required>
        </div>
        <div class="modal-field">
          <label>Category</label>
          <select id="taskCategory">
            <option>Coding</option>
            <option>Docs</option>
            <option>Design</option>
            <option>DevOps</option>
            <option>Other</option>
          </select>
        </div>
        <div class="modal-field">
          <label>Priority</label>
          <select id="taskPriority">
            <option>High</option>
            <option selected>Medium</option>
            <option>Low</option>
          </select>
        </div>
        <div id="taskFormErr" class="error"></div>
        <button class="btn-modal-submit" type="submit">Add Task</button>
      </form>
    </div>
  </div>

  <script type="module" src="./learner-tasks.js"></script>
</body>
</html>

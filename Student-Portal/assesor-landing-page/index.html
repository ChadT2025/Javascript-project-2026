  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="../placeholder/placeholder.css" />

  <body style="visibility:hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div>
          <span class="name">SkillsTrack</span>
          <span class="role">Asseseor</span>
        </div>
      </div>

      <nav class="nav">
        <a href="../assesor-landing-page/index.html" class="active">Overview</a>
        <a href="../learners-list/learners-list.html">Learners</a>
        <a href="../assessor-tasks/assessor-tasks.html">Tasks</a>
        <a href="../reviews/reviews.html">Reviews</a>

        <a href="../change-password/change-password.html">Change Password</a>
        <a href="#" class="signout">⏻ Sign Out</a>
      </div>
    </aside>

    <main class="content">
      <div class="topbar">
        <h1>Overview</h1>
        <button class="theme-btn">◐ Theme</button>
      </div>
      <div class="page">
        <div class="page">
          <div class="welcome-card">
            <div>
              <p class="welcome-title">

              </p>
              <p class="welcome-text" id="welcomeText">
                Lets see whats waiting for you
              </p>
            </div>

          <div class="stats-row">
            <div class="stat-card">
              <p class="stat-number" id="learnersCount">0</p>
              <p class="stat-label">LEARNERS</p>

            <div class="stat-card">
              <p class="stat-number" id="pendingCount">0</p>
              <p class="stat-label">PENDING REVIEWS</p>
            </div>

            <div class="stat-card">
              <p class="stat-number" id="reviewedCount">0</p>
              <p class="stat-label">REVIEWED</p>
            </div>
          </div>

          <div class="bottom-row">
            <div class="info-card session-card" id="sessionBox">
              <p class="card-title">UPCOMING SESSIONS</p>
              <a href="../schedule/schedule.html"
                ><p class="schedule-button">
                  Click here To See Your current Schedule
                </p></a
              >

          </div>
        </div>

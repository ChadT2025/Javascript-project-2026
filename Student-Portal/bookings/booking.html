<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Support Sessions</title>
    <link rel="stylesheet" href="../placeholder/placeholder.css" />
    <link rel="stylesheet" href="./booking.css" />
  </head>
  <body style="visibility:hidden">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div>
          <span class="name">SkillsTrack</span>
          <span class="role">LEARNER</span>
        </div>
      </div>

      <nav class="nav">
        <a href="../learner-dashboard/learner.html">Dashboard</a>
        <a href="../learner-progress/learner-progress.html">Progress</a>
        <a href="../tasks/learner-tasks.html">Tasks</a>
        <a href="../bookings/booking.html" class="active">Booking</a>
        <a href="../Hangman/hangman.html">Hangman</a>
      </nav>

      <div class="footer">
        <strong id="sidebarName">Loading…</strong>
        <a href="../change-password/change-password.html">Change Password</a>
        <a href="#" class="signout">⏻ Sign Out</a>
      </div>
    </aside>

    <main class="content">
      <div class="topbar">
        <h1>Booking Support Sessions</h1>
        <button class="theme-btn">◐ Theme</button>
      </div>
      <div class="page">
        <div class="header">
          <p class="title">Support Booking</p>

          <p class="slots-badge" id="slotsBadge">Loading...</p>
        </div>

        <div class="booking-card">
          <p class="select-label">YOUR NAME</p>

          <input
            class="select"
            id="nameInput"
            type="text"
            placeholder="Please Enter Your Name."
          />

          <p class="select-label">SELECT SESSION TOPIC</p>

          <select class="select" id="topicSelect">
            <option>1-on-1 Code Review & Debugging</option>
            <option>Career Advice</option>
            <option>Project Planning</option>
          </select>

          <p class="select-label">DATE & TIME SLOT</p>

          <select class="select" id="slotSelect"></select>

          <button
            class="confirm-button"
            id="confirmButton"
            onclick="handleBookingSubmit()"
          >
            Confirm Support Slot
          </button>
        </div>

        <div class="booking-card my-bookings">
          <p class="select-label">MY BOOKINGS</p>
          <div id="myBookings"><p class="my-empty">Loading…</p></div>
        </div>
      </div>
    </main>
    <script type="module" src="booking.js"></script>
    <script type="module" src="../placeholder/placeholder.js"></script>
  </body>
</html>

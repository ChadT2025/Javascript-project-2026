<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillsTrack — Learners</title>
  <link rel="stylesheet" href="./learners-list.css">
</head>
<body style="visibility:hidden">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div><span class="name">SkillsTrack</span><span class="role">ASSESSOR</span></div>
    </div>
    <nav class="nav">
        <a href="../assesor-landing-page/index.html">Overview</a>
        <a href="../learners-list/learners-list.html" class="active">Learners</a>
        <a href="../assessor-tasks/assessor-tasks.html">Tasks</a>
        <a href="../reviews/reviews.html">Reviews</a>
        <a href="../schedule/schedule.html">Schedule</a>
      </nav>
    <div class="footer">
        <strong id="footerName">Loading…</strong>
        <a href="../change-password/change-password.html">Change Password</a>
        <a href="#" class="signout">⏻ Sign Out</a>
      </div>
  </aside>

  <main class="content">
    <div class="topbar">
      <h1>Learners</h1>
      <div class="topbar-actions">
        <button class="theme-btn" id="themeBtn">☾ Light</button>
      </div>
    </div>

    <div class="page">
      <section class="stats">
        <div class="stat"><div class="num"        id="statLearners">0</div><div class="label">Learners</div></div>
        <div class="stat"><div class="num amber"  id="statReview">0</div><div class="label">Tasks Awaiting Review</div></div>
        <div class="stat"><div class="num purple" id="statAvg">0%</div><div class="label">Average Completion</div></div>
      </section>

      <input class="search" id="filterInput" type="search" placeholder="Search learners by name or email…">

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Learner</th><th>Email</th><th>Approved</th>
              <th>Submitted</th><th>Progress</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="learnersBody">
            <tr><td colspan="6" class="empty-row">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script type="module" src="./learners-list.js"></script>
</body>
</html>

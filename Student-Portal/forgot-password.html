<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="glow-card">
      <div class="glow-inner">
        <div class="form-title">RESET PASSWORD</div>
        <form id="forgotForm">
          <div class="input-group">
            <i class="fa-regular fa-envelope"></i>
            <input id="fp_email" type="email" placeholder="Enter your account email" autocomplete="email" required>
          </div>
          <div id="fp_err" class="error"></div>
          <div id="fp_ok" class="success"></div>
          <button class="btn-glow" type="submit">Send Reset Link</button>
          <div class="form-links" style="justify-content:center">
            <a id="backLink" href="#">Back to login</a>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script type="module">
    import { initForgotForm } from "./auth.js";
    initForgotForm();
  </script>
</body>
</html>

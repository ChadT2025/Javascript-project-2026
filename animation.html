<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading - SkillsTrack</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
 
<div class="loader-overlay" id="loader">
  <div class="loader-glow">
    <div class="loader-inner">
      <div class="spinner"></div>
      <div class="loader-text">SkillsTrack</div>
      <small style="color:#6b7280;font-size:10px;margin-top:6px;display:block">Loading your workspace...</small>
      <div class="loader-dots"><span></span><span></span><span></span></div>
      <div class="progress-bar"><div class="progress-fill"></div></div>
    </div>
  </div>
</div>
 
<script>
// Simulate loading then redirect
setTimeout(()=>{
  document.getElementById('loader').classList.add('hide');
  setTimeout(()=> location.href='index.html', 600);
}, 2600);
</script>
 
</body>
</html>
has context menu
